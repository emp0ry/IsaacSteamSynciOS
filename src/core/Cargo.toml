[package]
name = "isaac-steam-core"
version = "1.3.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "isaac_steam_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
hex = "0.4"
libc = "0.2"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
steam-cm-protocol = "0.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[patch.crates-io]
steam-cm-protocol = { path = "../../vendor/steam-cm-protocol" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
